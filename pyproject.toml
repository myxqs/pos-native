[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-native"
version = "0.1.0"
description = "A local-first, provenance-aware personal context store for user-owned AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Will Millington"}]
keywords = ["personal-ai", "local-first", "provenance", "context", "sqlite", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
pos-native = "pos_native.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

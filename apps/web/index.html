<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>NativePOS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="login-panel" class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">Private workspace</p>
      <h1 id="login-title">NativePOS</h1>
      <p class="login-intro">
        Sign in to your local personal operating system.
      </p>
      <form id="login-form" aria-label="Sign in to NativePOS">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          autocomplete="username"
          inputmode="email"
          maxlength="320"
          required
          type="email"
        />
        <label for="login-password">Password</label>
        <input
          id="login-password"
          autocomplete="current-password"
          required
          type="password"
        />
        <button id="login-submit" type="submit">Sign in</button>
      </form>
      <p id="login-status" role="status" aria-live="polite"></p>
    </main>

    <div id="workspace" class="app-shell" hidden>
      <aside>
        <div class="sidebar-top">
          <div class="brand">NativePOS</div>
          <button id="logout" class="secondary-button" type="button">
            Sign out
          </button>
        </div>
        <form id="create-page" aria-label="Create page">
          <label for="new-page-title">New page</label>
          <div class="form-row">
            <input id="new-page-title" name="title" maxlength="500" required />
            <button type="submit">Create</button>
          </div>
        </form>
        <nav aria-label="Active pages">
          <ul id="page-list"></ul>
        </nav>
        <section class="collections-nav" aria-labelledby="collections-title">
          <h2 id="collections-title">Collections</h2>
          <form id="create-data-source" aria-label="Create collection">
            <div class="form-row">
              <input id="new-data-source-name" maxlength="120" required />
              <button type="submit">Create</button>
            </div>
          </form>
          <ul id="data-source-list"></ul>
        </section>
        <button
          id="show-archived-pages"
          class="secondary-button archive-toggle"
          type="button"
          aria-controls="archived-pages"
        >
          Show archived pages
        </button>
        <section
          id="archived-pages"
          hidden
          aria-labelledby="archived-pages-title"
        >
          <h2 id="archived-pages-title">Archived pages</h2>
          <ul id="archived-page-list"></ul>
        </section>
      </aside>
      <main>
        <p class="eyebrow">Private workspace</p>
        <h1>NativePOS</h1>
        <section id="editor" hidden>
          <nav id="breadcrumbs" aria-label="Page breadcrumbs"></nav>
          <label for="page-title">Page title</label>
          <div class="form-row">
            <input id="page-title" maxlength="500" />
            <button id="save-page" type="button">Save</button>
          </div>
          <div class="hierarchy-controls">
            <label for="page-parent">Parent page</label>
            <div class="form-row">
              <select id="page-parent" disabled></select>
              <button id="save-parent" type="button" disabled>Move</button>
              <button id="restore-page" type="button" hidden>Restore</button>
            </div>
            <button
              id="archive-page"
              class="secondary-button"
              type="button"
              hidden
            >
              Archive page
            </button>
          </div>
          <form id="create-child-page" aria-label="Create child page">
            <label for="new-child-page-title">New child page</label>
            <div class="form-row">
              <input
                id="new-child-page-title"
                name="title"
                maxlength="500"
                required
                disabled
              />
              <button type="submit">Create child</button>
            </div>
          </form>
          <div class="body-editor">
            <label for="page-body">Page body</label>
            <textarea
              id="page-body"
              aria-describedby="body-status"
              disabled
              maxlength="20000"
            ></textarea>
            <div class="form-row">
              <button id="save-body" type="button" disabled>Save body</button>
            </div>
            <p id="body-status" role="status" aria-live="polite"></p>
          </div>
        </section>
        <section id="collection-panel" hidden>
          <h2 id="collection-name"></h2>
          <form id="create-property-definition" aria-label="Create field">
            <label for="new-property-name">New field</label>
            <div class="form-row">
              <input id="new-property-name" maxlength="120" required />
              <select id="new-property-kind">
                <option value="text">Text</option>
                <option value="number">Number</option>
                <option value="checkbox">Checkbox</option>
                <option value="status">Status</option>
                <option value="relation">Relation</option>
              </select>
              <button type="submit">Add field</button>
            </div>
            <input
              id="new-property-options"
              placeholder="Status options, comma separated"
            />
            <input
              id="new-property-target"
              placeholder="Relation target collection ID"
            />
          </form>
          <form id="create-record" aria-label="Create collection record">
            <label for="new-record-title">New record</label>
            <div class="form-row">
              <input id="new-record-title" maxlength="500" required />
              <button type="submit">Create record</button>
            </div>
          </form>
          <ul id="record-list"></ul>
          <section id="record-inspector" hidden>
            <h3 id="record-title"></h3>
            <button
              id="open-record-page"
              class="secondary-button"
              type="button"
            >
              Open page
            </button>
            <form id="set-record-property" aria-label="Set record property">
              <select id="record-property-definition"></select>
              <input id="record-property-value" required />
              <button type="submit">Save value</button>
            </form>
            <form id="add-record-relation" aria-label="Add record relation">
              <select id="record-relation-definition"></select>
              <input
                id="record-relation-target"
                placeholder="Target record ID"
                required
              />
              <button type="submit">Add relation</button>
            </form>
            <ul id="record-relation-list"></ul>
            <p id="record-revision"></p>
          </section>
          <p id="collection-status" role="status" aria-live="polite"></p>
        </section>
        <p id="empty-state">Create a page to begin.</p>
        <p id="status" role="status" aria-live="polite"></p>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>NativePOS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="login-panel" class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">Private workspace</p>
      <h1 id="login-title">NativePOS</h1>
      <p class="login-intro">
        Sign in to your local personal operating system.
      </p>
      <form id="login-form" aria-label="Sign in to NativePOS">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          autocomplete="username"
          inputmode="email"
          maxlength="320"
          required
          type="email"
        />
        <label for="login-password">Password</label>
        <input
          id="login-password"
          autocomplete="current-password"
          required
          type="password"
        />
        <button id="login-submit" type="submit">Sign in</button>
      </form>
      <p id="login-status" role="status" aria-live="polite"></p>
    </main>

    <div id="workspace" class="app-shell" hidden>
      <aside>
        <div class="sidebar-top">
          <div class="brand">NativePOS</div>
          <button id="logout" class="secondary-button" type="button">
            Sign out
          </button>
        </div>
        <form id="create-page" aria-label="Create page">
          <label for="new-page-title">New page</label>
          <div class="form-row">
            <input id="new-page-title" name="title" maxlength="500" required />
            <button type="submit">Create</button>
          </div>
        </form>
        <nav aria-label="Pages">
          <ul id="page-list"></ul>
        </nav>
      </aside>
      <main>
        <p class="eyebrow">Private workspace</p>
        <h1>NativePOS</h1>
        <section id="editor" hidden>
          <label for="page-title">Page title</label>
          <div class="form-row">
            <input id="page-title" maxlength="500" />
            <button id="save-page" type="button">Save</button>
          </div>
          <div class="body-editor">
            <label for="page-body">Page body</label>
            <textarea
              id="page-body"
              aria-describedby="body-status"
              disabled
              maxlength="20000"
            ></textarea>
            <div class="form-row">
              <button id="save-body" type="button" disabled>Save body</button>
            </div>
            <p id="body-status" role="status" aria-live="polite"></p>
          </div>
        </section>
        <p id="empty-state">Create a page to begin.</p>
        <p id="status" role="status" aria-live="polite"></p>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
